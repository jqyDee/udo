publish = false
tag-name = "v{{version}}"
allow-branch = ["dev"]
pre-release-commit-message = "chore: release {{version}}"
# dry run: print the new section; `--execute`: write CHANGELOG.md
pre-release-hook = ["sh", "-c", "if [ \"$DRY_RUN\" = true ]; then git cliff --unreleased --tag v{{version}}; else git cliff -o CHANGELOG.md --tag v{{version}}; fi"]
